name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: python:3.12-slim-bookworm
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates dpkg-dev git pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build and verify archives and Debian package
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat build/version)"
          fi
          python3 tools/release.py --revision "$GITHUB_SHA" --deb --check \
            --output "$RUNNER_TEMP/release" -j "$(nproc)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  macos:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install make pkgconf
      - name: Build and verify portable archive
        run: |
          test "$(uname -m)" = arm64
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat build/version)"
          fi
          python3 tools/release.py --revision "$GITHUB_SHA" --check \
            --output "$RUNNER_TEMP/release" -j "$(sysctl -n hw.logicalcpu)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: incoming
      - name: Verify and collect release assets
        run: |
          prefix="sippymodem-${GITHUB_REF_NAME#v}-${GITHUB_SHA:0:12}"
          mkdir assets
          for platform in linux-x86_64 linux-aarch64 macos-arm64; do
            archive=$prefix-$platform
            dir="incoming/release-$platform/$archive"
            (cd "$dir" && sha256sum --strict --check SHA256SUMS)
            cp "$dir/$archive.tar.gz" "$dir/$archive-source.tar.gz" assets/
          done
          cp "incoming/release-linux-x86_64/$prefix-linux-x86_64/sippymodem_${GITHUB_REF_NAME#v}_amd64.deb" assets/
          cp "incoming/release-linux-aarch64/$prefix-linux-aarch64/sippymodem_${GITHUB_REF_NAME#v}_arm64.deb" assets/
          (cd assets && sha256sum *.tar.gz *.deb > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes assets/*
